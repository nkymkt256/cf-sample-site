<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>こうまるAI — つくりたいゲームをつくろう</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 48rem;
        padding: 2rem 1rem;
        line-height: 1.6;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.3rem;
      }
      .lead {
        margin-top: 0;
        color: rgba(127, 127, 127, 1);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin: 1.5rem 0;
      }
      #message {
        font: inherit;
        padding: 0.7rem;
        box-sizing: border-box;
        min-height: 5.5rem;
        resize: vertical;
        border-radius: 0.6rem;
        border: 1px solid rgba(127, 127, 127, 0.5);
        background: transparent;
        color: inherit;
      }
      button {
        font: inherit;
        padding: 0.7rem 1.1rem;
        border-radius: 0.6rem;
        border: 0;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        align-self: flex-start;
      }
      button:disabled {
        opacity: 0.5;
        cursor: progress;
      }
      #status {
        margin: 0.5rem 0;
        min-height: 1.6rem;
      }
      .spinner {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        margin-right: 0.5rem;
        vertical-align: -0.15rem;
        border: 2px solid rgba(127, 127, 127, 0.35);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      #error {
        display: none;
        padding: 0.8rem 1rem;
        border-radius: 0.6rem;
        border: 1px solid rgba(220, 38, 38, 0.5);
        background: rgba(220, 38, 38, 0.1);
      }
      #error p {
        margin: 0 0 0.6rem;
      }
      #stage {
        margin: 1.2rem 0;
      }
      #stage iframe {
        width: 100%;
        height: 30rem;
        border: 1px solid rgba(127, 127, 127, 0.4);
        border-radius: 0.6rem;
        background: #fff;
        display: block;
      }
      .hint {
        font-size: 0.85rem;
        color: rgba(127, 127, 127, 1);
      }
    </style>
  </head>
  <body>
    <h1>こうまるAI</h1>
    <p class="lead">つくりたいゲームを ことばで おしえてね。AI がその場で ゲームをつくって、下のわくの中であそべるようにするよ。</p>

    <form id="game-form">
      <label for="message">どんなゲームをつくる？</label>
      <textarea
        id="message"
        maxlength="16000"
        placeholder="れい: ねこがジャンプして さかなを あつめるゲーム"
        required
      ></textarea>
      <button id="send" type="submit">ゲームをつくる</button>
      <span class="hint">つくるのに 30秒くらい かかることがあるよ。まってね。</span>
    </form>

    <div id="status" aria-live="polite"></div>

    <div id="error" role="alert">
      <p id="error-message"></p>
      <button id="retry" type="button">もう一度作る</button>
    </div>

    <div id="stage"></div>

    <script>
      const WORKER_URL = "https://kimikara-cf-workers.n2001kouta.workers.dev";

      const form = document.querySelector("#game-form");
      const input = document.querySelector("#message");
      const sendButton = document.querySelector("#send");
      const retryButton = document.querySelector("#retry");
      const statusBox = document.querySelector("#status");
      const errorBox = document.querySelector("#error");
      const errorMessage = document.querySelector("#error-message");
      const stage = document.querySelector("#stage");

      let busy = false;
      let lastMessage = "";

      function setBusy(value) {
        busy = value;
        sendButton.disabled = value;
        retryButton.disabled = value;
        statusBox.innerHTML = value
          ? '<span class="spinner"></span>ゲームをつくっているよ…'
          : "";
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorBox.style.display = "block";
      }

      function hideError() {
        errorBox.style.display = "none";
        errorMessage.textContent = "";
      }

      /**
       * AI はコードフェンスや前置きを付けてくることがある。
       * Worker の完全性チェックはフェンス付きでも通ってしまうため、ここで HTML 本体だけを取り出す。
       */
      function extractHtml(text) {
        let html = String(text ?? "").trim();
        html = html.replace(/^```[a-zA-Z]*\s*\n?/, "").replace(/\n?```\s*$/, "");

        const start = html.search(/<!doctype\s+html/i);
        const end = html.toLowerCase().lastIndexOf("</html>");
        if (start !== -1 && end !== -1) {
          html = html.slice(start, end + "</html>".length);
        }

        return html.trim();
      }

      /**
       * 生成コードが親ページを操作できないよう、毎回まっさらな iframe を作り直して
       * sandbox="allow-scripts" のみで描画する（allow-same-origin は付けない）。
       */
      function renderGame(html) {
        stage.textContent = "";
        const frame = document.createElement("iframe");
        frame.setAttribute("sandbox", "allow-scripts");
        frame.setAttribute("title", "つくったゲーム");
        frame.srcdoc = html;
        stage.append(frame);
        frame.scrollIntoView({ block: "nearest" });
      }

      async function generate(message) {
        if (busy) return;

        lastMessage = message;
        hideError();
        setBusy(true);

        try {
          const response = await fetch(`${WORKER_URL.replace(/\/+$/, "")}/api/game`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              studentId: "demo-student",
              publicAppId: "cf-sample-site",
              message,
            }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.message || data.error || `HTTP ${response.status}`);
          }

          const html = extractHtml(data.text);
          if (!html) {
            throw new Error("ゲームをつくれませんでした。もう一度ためしてね。");
          }

          renderGame(html);
        } catch (error) {
          showError(error instanceof Error ? error.message : "通信に失敗しました。");
        } finally {
          setBusy(false);
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        generate(message);
      });

      retryButton.addEventListener("click", () => {
        const message = input.value.trim() || lastMessage;
        if (!message) return;
        generate(message);
      });
    </script>
  </body>
</html>
